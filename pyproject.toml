[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-narrative"
version = "0.1.0"
description = "Statistical regime detection with a measured natural-language explanation layer"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits a live external API; skipped unless --run-network is passed",
]
